<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 765" width="710" height="765" role="img" aria-label="Assalam Travel">
  <title>Assalam Travel</title>
  <defs>
    <linearGradient id="alg" gradientUnits="userSpaceOnUse" x1="110" y1="40" x2="580" y2="750">
      <stop offset="0" stop-color="#F9DC8C"/>
      <stop offset="0.28" stop-color="#EFC163"/>
      <stop offset="0.55" stop-color="#E3A93F"/>
      <stop offset="0.80" stop-color="#D49A33"/>
      <stop offset="1" stop-color="#BE8323"/>
    </linearGradient>

    <!-- Вырез: купол «перекрывает» минарет, шеврон и изгиб, оставляя зазор -->
    <mask id="alCut">
      <rect width="710" height="765" fill="#fff"/>
      <path d="M482 303C452 330 357 395 337 515C337 530 344 540 364 546L304 552L298 600L272 606L259 757L705 757L692 606L666 600L660 552L600 546C620 540 627 530 627 515C607 395 512 330 482 303Z"
            fill="#000" stroke="#000" stroke-width="24" stroke-linejoin="round"/>
      <path d="M640 306v-36c0-14 24-14 24 0v36Z" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#alCut)">
    <!-- Кисва: два шеврона -->
    <g fill="none" stroke="url(#alg)" stroke-width="40" stroke-linejoin="miter">
      <path d="M6 400 190 308 360 402"/>
      <path d="M6 478 190 386 400 502"/>
    </g>
    <!-- Изгиб Каабы -->
    <path d="M23 470C23 650 110 740 250 740l22 0" fill="none" stroke="url(#alg)" stroke-width="40"/>

    <!-- Минарет -->
    <g fill="url(#alg)">
      <path d="M652 0 676 186H628Z"/>
      <rect x="604" y="186" width="94" height="38" rx="4"/>
      <rect x="618" y="224" width="66" height="94"/>
      <rect x="604" y="318" width="94" height="34" rx="4"/>
      <rect x="622" y="352" width="58" height="262"/>
    </g>
  </g>

  <!-- Купол -->
  <path d="M482 303C452 330 357 395 337 515C337 530 344 540 364 546L304 552L298 600L272 606L259 757L705 757L692 606L666 600L660 552L600 546C620 540 627 530 627 515C607 395 512 330 482 303Z" fill="url(#alg)"/>

  <!-- Полумесяц на шпиле -->
  <rect x="476" y="255" width="12" height="54" rx="5" fill="url(#alg)"/>
  <path fill-rule="evenodd" fill="url(#alg)"
        d="M482 197a33 33 0 1 0 0 66 33 33 0 1 0 0-66Z M499 198a26 26 0 1 1 0 52 26 26 0 1 1 0-52Z"/>
</svg>
